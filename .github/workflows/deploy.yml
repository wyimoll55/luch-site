# Автоматическая публикация сайта на GitHub Pages после каждого git push
name: Публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # 1) Версия на HTML/JS (Vite) -> https://wyimoll55.github.io/luch-site/
      - run: npm ci
      - run: npm run build

      # 2) Версия на Kotlin/JS (Gradle) -> https://wyimoll55.github.io/luch-site/kotlin/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Сборка версии на Kotlin
        continue-on-error: true      # если Kotlin не соберётся, HTML-версия всё равно опубликуется
        working-directory: kotlin-site
        run: |
          chmod +x gradlew
          ./gradlew jsBrowserDistribution --no-daemon
      - name: Положить Kotlin-версию в папку /kotlin
        run: |
          if [ -d kotlin-site/build/dist/js/productionExecutable ]; then
            mkdir -p dist/kotlin
            cp -r kotlin-site/build/dist/js/productionExecutable/* dist/kotlin/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        uses: actions/deploy-pages@v4
