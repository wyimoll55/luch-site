<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог — Луч</title>
</head>
<body>
  <header id="header"></header>
  <main>
    <div class="container">
      <div class="page-head">
        <h1>Каталог</h1>
        <p class="muted">Все модели Минского часового завода: выберите коллекцию, механизм и цену.</p>
      </div>

      <form class="filters" id="filters">
        <select name="gender">
          <option value="">Для всех</option>
          <option>Мужские</option>
          <option>Женские</option>
          <option>Унисекс</option>
        </select>
        <select name="mechanism">
          <option value="">Любой механизм</option>
          <option>Механика</option>
          <option>Кварц</option>
        </select>
        <select name="collection"></select>
        <select name="sort">
          <option value="">Без сортировки</option>
          <option value="asc">Сначала дешевле</option>
          <option value="desc">Сначала дороже</option>
        </select>
        <button type="reset">Сбросить</button>
      </form>

      <div class="collection-about" id="collection-about"></div>
      <p class="muted" id="count"></p>
      <div class="grid" id="catalog-list"></div>
    </div>
  </main>
  <footer id="footer"></footer>
  <script type="module" src="/src/js/catalog.js"></script>
</body>
</html>
